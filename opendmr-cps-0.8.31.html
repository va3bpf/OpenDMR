:root{--bg:#eef2f6;--panel:#ffffff;--panel-2:#f5f8fb;--text:#142333;--muted:#5e6d7d;--faint:#8493a3;--line:#d8e0e8;--line-strong:#b9c7d4;--accent:#155b87;--accent-hover:#0f466a;--accent-soft:#e7f1f8;--accent-text:#124a70;--shadow:0 1px 2px rgba(15,35,55,.06),0 4px 12px rgba(15,35,55,.05);--shadow-lg:0 16px 36px rgba(15,35,55,.16);--radius:7px}
body{font-size:14px;letter-spacing:.005em}
.topbar{height:60px;padding:0 20px;background:#102b43;color:#f4f8fb;border-bottom:1px solid #0a2033;box-shadow:0 2px 8px rgba(8,28,45,.18)}
.brand{font-weight:700;letter-spacing:-.01em}.brand small{color:#b9cad8}.brand-mark{width:32px;height:32px;border-radius:6px;background:#1d6b98;border:1px solid rgba(255,255,255,.25);font-size:12px;letter-spacing:.04em}
.group{border-left-color:rgba(255,255,255,.16)}.topbar button{border-color:rgba(255,255,255,.22);background:transparent;color:#edf5fa}.topbar button:hover:not(:disabled){background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.42)}.topbar button.primary{background:#d39a2c;border-color:#d39a2c;color:#142333;font-weight:650}.topbar button.primary:hover:not(:disabled){background:#e2ad45;border-color:#e2ad45}
.statusbar{height:36px;background:#e5edf3;color:#4f6273;border-bottom-color:#cdd8e2}.sidebar{width:236px;padding:20px 12px 12px;background:#f8fafc;border-right-color:#d4dee7}.side-label{color:#718294}.side-foot{border-top-color:#dbe3eb}.tab{height:42px;border-radius:7px}.tab.active{box-shadow:inset 3px 0 0 var(--c)}
main{padding:20px 22px;gap:16px}.page-head h2{font-size:19px;letter-spacing:-.015em}.card{border-color:#d4dee7;box-shadow:var(--shadow)}.search{border-color:#b9c7d4;border-radius:7px}.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(21,91,135,.13)}
button{border-radius:7px}button:focus-visible,.tab:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #d39a2c;outline-offset:2px}
table.grid th{background:#edf3f7;color:#526679;padding-top:10px;padding-bottom:10px}table.grid td{padding-top:9px;padding-bottom:9px}table.grid tbody tr:hover td{background:#f2f7fa}table.grid tbody tr.selected td{background:#e3eff7}.group-row td{background:#dfeaf2!important;color:#28536d;font-weight:700;letter-spacing:.01em}
input,select,textarea{border-radius:6px}::selection{background:#b9d6e8;color:#102b43}::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-track{background:#edf2f6}::-webkit-scrollbar-thumb{background:#b8c6d2;border:2px solid #edf2f6;border-radius:8px}::-webkit-scrollbar-thumb:hover{background:#8ea2b3}
@media (prefers-color-scheme:dark){:root{--bg:#0d1722;--panel:#142434;--panel-2:#192d3e;--text:#e8f0f6;--muted:#a9bac8;--faint:#718596;--line:#294052;--line-strong:#3c586d;--accent:#65a6d0;--accent-hover:#87bddf;--accent-soft:#1d3b52;--accent-text:#b9ddf3;--shadow:0 1px 2px rgba(0,0,0,.4),0 5px 16px rgba(0,0,0,.18)}.topbar{background:#091b2b;border-bottom-color:#06131f}.statusbar{background:#102332;color:#a9bac8;border-bottom-color:#294052}.sidebar{background:#10202e;border-right-color:#294052}.table.grid th{background:#1b3244;color:#b8c9d6}.group-row td{background:#203d52!important;color:#b9ddf3}.topbar button.primary{color:#10202e}::-webkit-scrollbar-track{background:#10202e}::-webkit-scrollbar-thumb{background:#3c586d;border-color:#10202e}}

/* Control finish: tactile, restrained console controls */
button{font-size:13px;font-weight:600;letter-spacing:.012em;text-shadow:0 1px 0 rgba(255,255,255,.55);box-shadow:0 1px 2px rgba(15,35,55,.10),0 2px 5px rgba(15,35,55,.06);transition:transform .12s ease,box-shadow .12s ease,background .12s ease,border-color .12s ease,color .12s ease}
button:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 2px 4px rgba(15,35,55,.14),0 5px 10px rgba(15,35,55,.08)}button:active:not(:disabled){transform:translateY(0);box-shadow:inset 0 1px 2px rgba(15,35,55,.18),0 1px 2px rgba(15,35,55,.08)}button.primary{box-shadow:0 2px 4px rgba(15,75,115,.24),0 5px 10px rgba(15,75,115,.14);text-shadow:0 1px 1px rgba(0,0,0,.18)}button.primary:hover:not(:disabled){box-shadow:0 3px 6px rgba(15,75,115,.28),0 7px 14px rgba(15,75,115,.16)}button.ghost{box-shadow:none;text-shadow:none}.topbar button{font-weight:600;text-shadow:0 1px 1px rgba(0,0,0,.20);box-shadow:0 1px 2px rgba(0,0,0,.18)}.topbar button.ghost{box-shadow:none}.topbar button.primary{box-shadow:0 2px 4px rgba(0,0,0,.24),0 5px 10px rgba(0,0,0,.14);text-shadow:none}.tab{font-size:13.5px;letter-spacing:.008em;text-shadow:none;box-shadow:none}.tab:hover:not(:disabled){transform:none}.tab.active{box-shadow:inset 3px 0 0 var(--c),0 1px 3px color-mix(in srgb,var(--c) 12%,transparent)}.tab:active:not(:disabled){box-shadow:inset 3px 0 0 var(--c),inset 0 1px 2px rgba(15,35,55,.10)}select,input,textarea{box-shadow:inset 0 1px 2px rgba(15,35,55,.06),0 1px 1px rgba(15,35,55,.03)}select:focus,input:focus,textarea:focus{box-shadow:0 0 0 3px rgba(21,91,135,.13),inset 0 1px 2px rgba(15,35,55,.06)}
@media (prefers-color-scheme:dark){button{ text-shadow:0 1px 1px rgba(0,0,0,.35);box-shadow:0 1px 2px rgba(0,0,0,.35),0 3px 7px rgba(0,0,0,.18)}button:hover:not(:disabled){box-shadow:0 2px 4px rgba(0,0,0,.45),0 6px 12px rgba(0,0,0,.24)}button:active:not(:disabled){box-shadow:inset 0 1px 2px rgba(0,0,0,.42),0 1px 2px rgba(0,0,0,.3)}.tab{box-shadow:none}.tab.active{box-shadow:inset 3px 0 0 var(--c),0 1px 3px rgba(0,0,0,.22)}select,input,textarea{box-shadow:inset 0 1px 2px rgba(0,0,0,.25)}}
